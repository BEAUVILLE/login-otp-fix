<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vérification - DIGIYLYFE</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    *{margin:0;padding:0;box-sizing:border-box}
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background:linear-gradient(135deg,#00853F 0%,#FCD116 100%);
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      padding:20px;
    }
    .douane-container{
      background:#fff;
      border-radius:20px;
      box-shadow:0 20px 60px rgba(0,0,0,.3);
      max-width:500px;
      width:100%;
      padding:50px 40px;
      text-align:center;
    }
    .infinity{
      font-size:60px;
      color:#FCD116;
      margin-bottom:20px;
      animation:pulse 2s infinite;
    }
    @keyframes pulse{0%,100%{opacity:1}50%{opacity:.5}}
    h1{color:#00853F;font-size:24px;margin-bottom:15px}
    .status{color:#666;font-size:16px;margin-bottom:30px}
    .spinner{
      width:50px;height:50px;
      border:5px solid #f3f3f3;
      border-top:5px solid #00853F;
      border-radius:50%;
      animation:spin 1s linear infinite;
      margin:30px auto;
    }
    @keyframes spin{0%{transform:rotate(0)}100%{transform:rotate(360deg)}}
    .error-box{
      background:#f8d7da;
      color:#721c24;
      padding:20px;
      border-radius:10px;
      margin-top:20px;
      display:none;
    }
    .error-box.show{display:block}
    .btn-retry{
      background:#00853F;
      color:#fff;
      padding:12px 30px;
      border:none;
      border-radius:10px;
      font-size:16px;
      font-weight:600;
      cursor:pointer;
      margin-top:20px;
    }
    .btn-retry:hover{background:#006830}
  </style>
</head>

<body>

<div class="douane-container">
  <div class="infinity">∞</div>
  <h1>DIGIYLYFE</h1>
  <p class="status" id="status">Vérification de votre accès...</p>
  <div class="spinner" id="spinner"></div>

  <div id="errorBox" class="error-box">
    <p id="errorMessage"></p>
    <button class="btn-retry" onclick="location.reload()">Réessayer</button>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://wesqmwjjtsefyjnluosj.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indlc3Ftd2pqdHNlZnlqbmx1b3NqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NjUxNzg4ODIsImV4cCI6MjA4MDc1NDg4Mn0.dZfYOc2iL2_wRYL3zExZFsFSBK6AbMeOid2LrIjcTdA';

  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  const statusEl = document.getElementById('status');
  const spinnerEl = document.getElementById('spinner');
  const errorBoxEl = document.getElementById('errorBox');
  const errorMessageEl = document.getElementById('errorMessage');

  function showError(message){
    statusEl.textContent = 'Erreur';
    spinnerEl.style.display = 'none';
    errorMessageEl.textContent = message;
    errorBoxEl.classList.add('show');
  }

  function updateStatus(text){
    statusEl.textContent = text;
  }

  function normalizeModules(modules){
    if(!modules) return [];
    if(Array.isArray(modules)) return modules.map(m=>String(m).trim()).filter(Boolean);
    if(typeof modules === 'string'){
      if(modules.startsWith('{') && modules.endsWith('}')){
        return modules.slice(1,-1).split(',').map(m=>m.replaceAll('"','').trim()).filter(Boolean);
      }
      try{
        const parsed = JSON.parse(modules);
        if(Array.isArray(parsed)) return parsed.map(m=>String(m).trim()).filter(Boolean);
      }catch{}
      return [modules.trim()];
    }
    return [];
  }

  function pickRedirect(mods){
    if(mods.length > 1) return './mon-espace-choix.html';
    const m = mods[0].toLowerCase();
    if(['chauffeur','driver','vtc'].includes(m)) return 'https://beauville.github.io/digiy-chauffeur/';
    if(['loc','logement','hébergement','hebergement','accommodation'].includes(m)) return 'https://beauville.github.io/digiy-loc/';
    if(['restaurant','resto','restauration'].includes(m)) return 'https://beauville.github.io/digiy-resto/';
    return './mon-espace.html';
  }

  async function routerDouane(){
    try{
      updateStatus('Vérification de votre session...');
      const { data:{ session } } = await supabase.auth.getSession();

      if(!session){
        showError('Session expirée. Veuillez vous reconnecter.');
        setTimeout(()=>location.replace('./index.html'),1500);
        return;
      }

      updateStatus('Chargement de votre profil...');
      const { data:pro, error } = await supabase
        .from('pros')
        .select('*')
        .eq('auth_user_id', session.user.id)
        .maybeSingle();

      if(error){
        showError('Erreur lors du chargement du profil.');
        return;
      }

      if(!pro){
        setTimeout(()=>location.replace('./inscription-pro.html'),1000);
        return;
      }

      if(!pro.is_active){
        showError('Compte en attente de validation.');
        return;
      }

      const modules = normalizeModules(pro.modules);
      if(modules.length === 0){
        showError('Aucun module activé.');
        return;
      }

      updateStatus('Redirection...');
      sessionStorage.setItem('digiy_pro', JSON.stringify(pro));

      setTimeout(()=>{
        location.replace(pickRedirect(modules));
      },400);

    }catch{
      showError('Erreur inattendue.');
    }
  }

  routerDouane();
</script>

</body>
</html>
