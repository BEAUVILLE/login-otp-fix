<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Vérification - DIGIYLYFE</title>

  <!-- ✅ SUPABASE UMD -->
  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>

  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body{
      font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
      background:linear-gradient(135deg,#00853F 0%,#FCD116 100%);
      min-height:100vh; display:flex; align-items:center; justify-content:center;
      padding:20px;
    }
    .douane-container{
      background:#fff; border-radius:20px; box-shadow:0 20px 60px rgba(0,0,0,0.3);
      max-width:520px; width:100%; padding:50px 40px; text-align:center;
    }
    .infinity{ font-size:60px; color:#FCD116; margin-bottom:20px; animation:pulse 2s infinite; }
    @keyframes pulse{ 0%,100%{opacity:1} 50%{opacity:.55} }
    h1{ color:#00853F; font-size:24px; margin-bottom:12px; font-weight:900; }
    .status{ color:#666; font-size:16px; margin-bottom:28px; }
    .spinner{
      width:50px; height:50px; border:5px solid #f3f3f3;
      border-top:5px solid #00853F; border-radius:50%;
      animation:spin 1s linear infinite; margin:30px auto;
    }
    @keyframes spin{ 0%{transform:rotate(0deg)} 100%{transform:rotate(360deg)} }
    .error-box{
      background:#f8d7da; color:#721c24; padding:18px; border-radius:12px;
      margin-top:18px; display:none; text-align:left;
    }
    .error-box.show{ display:block; }
    .btn-retry{
      background:#00853F; color:#fff; padding:12px 18px; border:none; border-radius:10px;
      font-size:15px; font-weight:800; cursor:pointer; margin-top:12px; transition:all .2s ease;
      width:100%;
    }
    .btn-retry:hover{ background:#006830; transform:translateY(-1px); }
    .debug-info{
      background:#f8f9fa; padding:12px; border-radius:10px; margin-top:12px;
      font-size:12px; color:#444; font-family:ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      display:none; text-align:left; white-space:pre-wrap;
    }
    .debug-info.show{ display:block; }
  </style>
</head>

<body>
  <div class="douane-container">
    <div class="infinity">∞</div>
    <h1>DIGIYLYFE</h1>
    <p class="status" id="status">Vérification de votre accès...</p>

    <div class="spinner" id="spinner"></div>

    <div id="errorBox" class="error-box">
      <div id="errorMessage"></div>
      <button class="btn-retry" onclick="location.reload()">Réessayer</button>
    </div>

    <div id="debugInfo" class="debug-info"></div>
  </div>

  <script>
    const SUPABASE_URL = 'https://wesqmwjjtsefyjnluosj.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Indlc3Ftd2pqdHNlZnlqbmx1b3NqIiwicm9sZSI6ImFub24iLCJpYXQiOjE3MzQwOTg1NzMsImV4cCI6MjA0OTY3NDU3M30.kKIDqJBRxJCqr05S3vOGWNhTYl-SG4n7W1ZxDmr6xyo';

    const statusEl = document.getElementById('status');
    const spinnerEl = document.getElementById('spinner');
    const errorBoxEl = document.getElementById('errorBox');
    const errorMessageEl = document.getElementById('errorMessage');
    const debugInfoEl = document.getElementById('debugInfo');

    function updateStatus(text){
      statusEl.textContent = text;
      console.log('📍', text);
    }

    function showError(message, debug = null){
      statusEl.textContent = 'Erreur de connexion';
      spinnerEl.style.display = 'none';
      errorMessageEl.textContent = message;
      errorBoxEl.classList.add('show');

      if (debug){
        debugInfoEl.textContent = JSON.stringify(debug, null, 2);
        debugInfoEl.classList.add('show');
      }

      console.error('❌ Douane error:', message, debug);
    }

    window.addEventListener('DOMContentLoaded', async () => {
      if (!window.supabase || !window.supabase.createClient) {
        showError("Supabase SDK indisponible (script non chargé). Désactive adblock/extension et refresh.", { window_supabase: window.supabase });
        return;
      }

      const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

      async function routerDouane(){
        try {
          // 1) Session
          updateStatus('Vérification de votre session...');
          const { data: { session }, error: sessionError } = await supabase.auth.getSession();

          if (sessionError) throw new Error(`Session error: ${sessionError.message}`);

          if (!session) {
            showError('Aucune session active. Veuillez vous reconnecter.');
            setTimeout(() => window.location.replace('./index.html'), 1200);
            return;
          }

          console.log('✅ Session active:', session.user.id);

          // 2) Profil PRO
          updateStatus('Chargement de votre profil...');

          const { data: pros, error: prosError } = await supabase
            .from('pros')
            .select('*')
            .eq('auth_user_id', session.user.id)
            .single();

          if (prosError) {
            console.warn('⚠️ prosError:', prosError);

            // pas trouvé -> inscription
            if (prosError.code === 'PGRST116') {
              showError("Aucun profil professionnel trouvé. Redirection vers l'inscription...");
              setTimeout(() => window.location.replace('./inscription-pro.html'), 1400);
              return;
            }

            throw new Error(`DB error: ${prosError.message}`);
          }

          if (!pros) {
            showError('Profil professionnel introuvable.');
            return;
          }

          console.log('✅ Dossier pro:', pros);

          // 3) Statut + routing
          updateStatus('Redirection vers votre espace...');

          const { type_pro, statut } = pros;

          if (statut === 'en_attente') {
            showError('Votre compte est en cours de validation. Vous recevrez un SMS dès activation.');
            return;
          }
          if (statut === 'suspendu') {
            showError('Votre compte est suspendu. Contactez le support DIGIYLYFE.');
            return;
          }

          let redirectUrl;

          switch (type_pro) {
            case 'chauffeur':
            case 'driver':
              redirectUrl = 'https://beauville.github.io/digiy-driver-client/';
              break;

            case 'logement':
            case 'loc':
            case 'accommodation':
              redirectUrl = 'https://beauville.github.io/digiy-loc/';
              break;

            case 'restaurant':
            case 'resto':
              redirectUrl = 'https://beauville.github.io/digiy-resto/';
              break;

            case 'multi':
              redirectUrl = './mon-espace-choix.html';
              break;

            default:
              redirectUrl = './mon-espace.html';
          }

          sessionStorage.setItem('digiy_pro', JSON.stringify(pros));
          console.log(`🚀 Redirection vers: ${redirectUrl} (type_pro=${type_pro})`);

          setTimeout(() => window.location.replace(redirectUrl), 400);

        } catch (e) {
          showError(e.message || 'Erreur lors de la vérification', { error: String(e) });
        }
      }

      routerDouane();
    });
  </script>
</body>
</html>
